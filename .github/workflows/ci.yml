# mdatron CI gauntlet (tracker issue #68).
#
# Shape follows the crosslink/Thermite reference (operator ruling 2026-07-19,
# DESIGN.md § Structural inspiration): lint -> {test-matrix, security-audit}.
# Deliberate divergence from vsdd-cli's `vsdd-*.yml` / `vsdd init` deployment
# convention: mdatron's default engineering reference is crosslink/Thermite, not
# vsdd-cli, so this is a hand-authored `ci.yml` (DESIGN.md: divergence from an
# upstream convention carries a stated reason).
#
# Reproducibility: the toolchain is pinned to the project MSRV (1.88, matching
# rust-toolchain.toml), Cargo.lock is committed, and every build/test runs
# --locked. Because all jobs use 1.88, green CI also proves MSRV compliance.
name: CI

on:
  push:
    # main plus the working-branch namespaces; crosslink/** tracker branches
    # (hub, knowledge, agents, ...) are intentionally excluded — they carry no
    # buildable source.
    branches: [main, "feature/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # unix confinement (openat/O_NOFOLLOW handle walks) is the primary
        # security path — exercised on Linux and macOS. windows-latest builds
        # and tests the non-unix fallback (symlink_metadata + open / path-based
        # list_dir), so it no longer bit-rots unbuilt; the unix-only tests are
        # cfg-gated off there. The fallback's weaker TOCTOU posture is the
        # documented carve-out (#56) pending the handle-based Windows walk (#64).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose

  audit:
    name: Security audit (cargo-audit + cargo-deny)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      # Prebuilt binaries — avoid building the tools themselves under the pinned
      # MSRV (they track a newer toolchain). Both only read Cargo.lock/metadata.
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # cargo-deny is version-pinned (roast C1, #141): its closed license
          # allow-list must not float to a future release that tightens SPDX
          # evaluation or deprecates a deny.toml field and red the gate with no
          # repo change. cargo-audit stays unpinned — its advisory DB updates
          # independently of the binary, so advisory freshness is unaffected.
          tool: cargo-audit,cargo-deny@0.20.2

      - name: Audit dependencies (RustSec advisories)
        run: cargo audit --deny warnings

      # Roast C4 (#139): license/bans/sources gate over the full tree, so an
      # incompatible license or an untrusted source in a transitive dep fails CI.
      # Advisories stay with cargo-audit above (no double-check divergence).
      - name: Deny check (licenses + bans + sources)
        run: cargo deny check bans licenses sources

  self-validate:
    # The self-hosting gate (#46): mdatron verifies its OWN typed-markdown
    # corpus (review-log/*.md) against its OWN committed .mdatron/ config,
    # using the mdatron built from this very checkout. A schema violation in
    # any review-log entry fails the build — the blocking release gate. This
    # is what let the throwaway bootstrap-validator be retired.
    name: Self-validation (mdatron verify on this repo)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build the mdatron CLI
        run: cargo build -p mdatron --locked

      # init on the already-initialized repo must be a clean no-op: it proves
      # the committed managed partition (.mdatron/config.yaml) still matches
      # its manifest hash — i.e. no un-recorded drift landed. A drifted managed
      # file exits 1 (MDATRON-E0060) and fails here.
      - name: Managed partition intact (init is a no-op, not drift)
        run: cargo run -q -p mdatron --locked -- init --project-root .

      # The gate: every review-log entry must satisfy schemas/review-entry.json.
      - name: Verify this repo against its own .mdatron/ config
        run: cargo run -q -p mdatron --locked -- verify --project-root .

  package:
    # Publish rehearsal (#123, roast SHO3): green code-CI says nothing about what
    # the crate ARTIFACT contains. This job proves the package is publishable AND
    # that the include-allowlist holds — the internal apparatus (.claude/,
    # .crosslink/ incl. a committed key, review-log/, .vsdd/, .mdatron/) must NOT
    # ship. Without this gate, the LICENSE + 221-file-bloat blockers were invisible.
    name: Package rehearsal (cargo publish --dry-run + payload allowlist)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The payload must contain the LICENSE and must NOT contain any internal
      # apparatus. Fail loudly on a leak rather than discovering it post-publish.
      - name: Assert the package payload matches the allowlist
        run: |
          files="$(cargo package --list --locked)"
          echo "$files"
          echo "$files" | grep -qx 'LICENSE' || { echo '::error::LICENSE missing from package payload'; exit 1; }
          if echo "$files" | grep -Eq '^(\.claude/|\.crosslink/|review-log/|\.vsdd/|\.mdatron/|REPLACE$|BOOTSTRAP-|dsl-falsifiability)'; then
            echo '::error::internal apparatus leaked into the crate payload — tighten Cargo.toml include'
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
