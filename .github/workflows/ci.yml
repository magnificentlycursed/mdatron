# mdatron CI gauntlet (tracker issue #68).
#
# Shape follows the crosslink/Thermite reference (operator ruling 2026-07-19,
# DESIGN.md § Structural inspiration): lint -> {test-matrix, security-audit}.
# Deliberate divergence from vsdd-cli's `vsdd-*.yml` / `vsdd init` deployment
# convention: mdatron's default engineering reference is crosslink/Thermite, not
# vsdd-cli, so this is a hand-authored `ci.yml` (DESIGN.md: divergence from an
# upstream convention carries a stated reason).
#
# Reproducibility: the toolchain is pinned to the project MSRV (1.88, matching
# rust-toolchain.toml), Cargo.lock is committed, and every build/test runs
# --locked. Because all jobs use 1.88, green CI also proves MSRV compliance.
name: CI

on:
  push:
    # main + release/** + tags (#178 as amended by GH #52 major 5): #178 cut
    # push-CI to main only so a working branch under PR gets exactly ONE run
    # (pull_request) instead of a push+PR pair cancelling each other in the
    # same concurrency group (stranding required contexts as CANCELLED —
    # Ch18's "retries are a tail-latency tax", live). That rationale is
    # unchanged — but it accidentally left the RELEASE surface with no CI at
    # all: a release/** push triggered nothing, and no tag re-ran the
    # gauntlet on the tagged tree, so the blocking self-verify release gate
    # physically could not fire where releases are cut. A branch that wants
    # CI before its PR exists opens a draft PR. crosslink/** tracker branches
    # stay excluded — no buildable source.
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Manual dispatch runs the whole gauntlet PLUS the deep parser-robustness
  # profile (GH #52 major 1 — the on-demand deep-fuzz surface; the per-PR run
  # is a bounded, seeded smoke).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # unix confinement (openat/O_NOFOLLOW handle walks) is the primary
        # security path — exercised on Linux and macOS. windows-latest builds
        # and tests the non-unix fallback (symlink_metadata + open / path-based
        # list_dir), so it no longer bit-rots unbuilt; the unix-only tests are
        # cfg-gated off there. The fallback's weaker TOCTOU posture is the
        # documented carve-out (#56) pending the handle-based Windows walk (#64).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose

  # Parser-robustness gate (GH #52 major 1, crosslink #184): the input parsers
  # are a declared trust boundary, and blockers 2/3 (a parser panic and a
  # parser abort) reached a green RC because no CI job fed them malformed
  # input. This job drives every input parser with hostile generated input
  # (proptest, MSRV-clean on 1.88 — no nightly anywhere) under the never-panic
  # property, plus deterministic revert-detector seeds for the fixed classes.
  # BOUNDED per PR: a pinned RNG seed + 1024 cases (~10s). The deep profile
  # runs only on manual workflow_dispatch. NOT in the required-check set
  # (operator decision, parked).
  parser-robustness:
    name: Parser robustness (bounded property fuzz)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Bounded property fuzz (seeded, deterministic)
        env:
          PROPTEST_CASES: "1024"
          PROPTEST_RNG_SEED: "20260919"
        run: cargo test --locked --test parser_robustness

      - name: Deep property fuzz (on-demand only)
        if: github.event_name == 'workflow_dispatch'
        env:
          PROPTEST_CASES: "16384"
        run: cargo test --locked --test parser_robustness

  audit:
    name: Security audit (cargo-audit + cargo-deny)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      # Prebuilt binaries — avoid building the tools themselves under the pinned
      # MSRV (they track a newer toolchain). Both only read Cargo.lock/metadata.
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # cargo-deny is version-pinned (roast C1, #141): its closed license
          # allow-list must not float to a future release that tightens SPDX
          # evaluation or deprecates a deny.toml field and red the gate with no
          # repo change. cargo-audit stays unpinned — its advisory DB updates
          # independently of the binary, so advisory freshness is unaffected.
          tool: cargo-audit,cargo-deny@0.20.2

      - name: Audit dependencies (RustSec advisories)
        run: cargo audit --deny warnings

      # Roast C4 (#139): license/bans/sources gate over the full tree, so an
      # incompatible license or an untrusted source in a transitive dep fails CI.
      # Advisories stay with cargo-audit above (no double-check divergence).
      - name: Deny check (licenses + bans + sources)
        run: cargo deny check bans licenses sources

  self-validate:
    # The self-hosting gate (#46): mdatron verifies its OWN typed-markdown
    # corpus (review-log/*.md) against its OWN committed .mdatron/ config,
    # using the mdatron built from this very checkout. A schema violation in
    # any review-log entry fails the build — the blocking release gate. This
    # is what let the throwaway bootstrap-validator be retired.
    name: Self-validation (mdatron verify on this repo)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the amendment-citation range scan below walks
          # origin/main..HEAD (a depth-1 clone has no range to walk).
          fetch-depth: 0

      # Grade-3 leg of the amendment seam (#96, #170 methodology-docs review
      # F2): re-derive, over server-synced state, that every DESIGN.md-touching
      # commit in the pushed range carries an authorizing issue reference AND a
      # ratification citation — the same two greps `.githooks/commit-msg`
      # applies at commit time (merge commits skipped, mirroring the hook's
      # integration-merge scope). This is what catches history written by an
      # UNBOUND clone: a fresh clone silently drops the local core.hooksPath
      # binding, and the seam seeds only prove the checker script's integrity —
      # they never look at the commits themselves. This job is a required
      # status check, so an uncited amendment cannot merge.
      - name: Amendment citations hold over the pushed range (methodology §3)
        run: |
          base=$(git merge-base origin/main HEAD)
          bad=0
          for c in $(git rev-list --no-merges "$base"..HEAD -- DESIGN.md); do
            msg=$(git log -1 --format=%B "$c")
            if ! { echo "$msg" | grep -qE '#[0-9]+' \
                && echo "$msg" | grep -qiE 'ratif|operator (ruling|decision)|cold review|review-log|§[0-9]|decision'; }; then
              echo "::error::DESIGN.md amendment $c lacks an issue reference and/or ratification citation (methodology §3)"
              git log -1 --format='%h %s' "$c"
              bad=1
            fi
          done
          exit $bad

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build the mdatron CLI
        run: cargo build -p mdatron --locked

      # init on the already-initialized repo must be a clean no-op: it proves
      # the committed managed partition (.mdatron/config.yaml) still matches
      # its manifest hash — i.e. no un-recorded drift landed. A drifted managed
      # file exits 1 (MDATRON-E0060) and fails here.
      - name: Managed partition intact (init is a no-op, not drift)
        run: cargo run -q -p mdatron --locked -- init --project-root .

      # The gate: every review-log entry must satisfy schemas/review-entry.json.
      # --deny-warnings: the gate takes its own documented escalation (GH #48
      # lane-G review) — a warnings-only run (e.g. W0048, a reference check
      # skipped over an unverifiable target) must fail this gate, not pass it.
      - name: Verify this repo against its own .mdatron/ config
        run: cargo run -q -p mdatron --locked -- verify --project-root . --deny-warnings

  package:
    # Publish rehearsal (#123, roast SHO3): green code-CI says nothing about what
    # the crate ARTIFACT contains. This job proves the package is publishable AND
    # that the include-allowlist holds — the internal apparatus (.claude/,
    # .crosslink/ incl. a committed key, review-log/, .vsdd/, .mdatron/) must NOT
    # ship. Without this gate, the LICENSE + 221-file-bloat blockers were invisible.
    name: Package rehearsal (cargo publish --dry-run + payload allowlist)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (pinned to the project MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The payload must contain the LICENSE and must NOT contain any internal
      # apparatus. Fail loudly on a leak rather than discovering it post-publish.
      - name: Assert the package payload matches the allowlist
        run: |
          files="$(cargo package --list --locked)"
          echo "$files"
          echo "$files" | grep -qx 'LICENSE' || { echo '::error::LICENSE missing from package payload'; exit 1; }
          # docs/limits.md is hard-required by a SHIPPED test (limits::docs_limits_table_matches_shipped);
          # without it, `cargo test` from the published crate fails (GH #48 lane E).
          echo "$files" | grep -qx 'docs/limits.md' || { echo '::error::docs/limits.md missing from package payload — a shipped test reads it'; exit 1; }
          if echo "$files" | grep -Eq '^(\.claude/|\.crosslink/|review-log/|\.vsdd/|\.mdatron/|REPLACE$|BOOTSTRAP-|dsl-falsifiability)'; then
            echo '::error::internal apparatus leaked into the crate payload — tighten Cargo.toml include'
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
