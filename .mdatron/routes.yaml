# mdatron route table — the closed-world allowlist over the governed tree (#83).
# Adopter-owned data; engine-shipped strict schema. Every walked file must be
# claimed by exactly one route.
routes:
# The LIVING docs corpus (#187 part 2): route-only governance with the link
# family on — dead links and dead anchors in the shipped documentation block
# from day one. No frontmatter requirement (phase 1; the link family needs
# none). Route `*` crosses `/`, and a route glob has no exclusion form, so the
# corpus is carved by character class: `docs/[!dm]*.md` claims every docs path
# whose first letter is neither `d` nor `m`, and `docs/d[!e]*.md` takes the
# `d` paths back except `docs/de…` — leaving `docs/dependencies/**` to the
# typed dependency-record route below (#190) and `docs/methodology*` to the
# standing methodology route (two routes claiming one file is an error by
# contract). A future docs path starting `de` or `m` lands unrouted (E0030) —
# loud and fail-closed, a deliberate routing decision.
- files: "docs/[!dm]*.md"
  governed_by: DESIGN.md
  links: true
- files: "docs/d[!e]*.md"
  governed_by: DESIGN.md
  links: true
# Dependency records (#190): one typed record per Cargo dependency. The
# frontmatter is required (config.yaml `require_frontmatter`) and its shape is
# validated by `.mdatron/schemas/dependency-record.json` through
# `schema_class`; the agnosticism suite holds the record set in bijection with
# Cargo.toml. The naming grammar is the crate-name grammar plus `.md`.
- files: "docs/dependencies/*.md"
  governed_by: DESIGN.md
  links: true
  naming: "^[a-z0-9_-]+\\.md$"
- files: "README.md"
  governed_by: DESIGN.md
  links: true
# The root governing document claims itself (#204): the closed-world walk needs
# a claimant for every walked file and nothing stands above DESIGN.md; walking
# it puts the canonical lexicon it declares under the register it declares.
- files: "DESIGN.md"
  governed_by: DESIGN.md
  links: true
# The methodology docs that govern mdatron's own development (#96/#97). Claimed
# so the closed-world walk has no unrouted file; governed by DESIGN.md, the root
# governing document.
- files: "docs/methodology*.md"
  governed_by: DESIGN.md
  naming: "^methodology(-[a-z]+)?\\.md$"
