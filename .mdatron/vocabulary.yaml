# mdatron's own naming register (methodology §5), scoped by vocabulary_globs
# (#97). This is the dogfood: mdatron's own engine enforcing its own naming
# discipline on its own prose.
#
# terms: the canonical lexicon (DESIGN § Project declarations, Terms — ontology
# review #204, 2026-09-24). A canonical spelling is `registered`; a retired
# alias is `reserved`, so its reappearance in governed prose fires
# MDATRON-E0092 — the drift the review found is now loud by construction.
#
# label_schemes.allow registers the permitted label schemes; a letter-plus-
# number cluster outside them fires MDATRON-E0091 (the letter-cluster
# prohibition, the register's flagship). mdatron's own diagnostic codes are the
# one registered scheme that may appear in governance prose; a coined cluster
# (a struck seam handle, an invented label) is not — it fires.
mdatron_format_version: 1
terms:
  - term: "conformance engine"
    status: registered
    sense: "the product; not a validator or linter (those name the neighbouring tools)"
  - term: "check family"
    status: registered
    sense: "one of the nine generic engines; its name is its envelope families key"
  - term: "rule DSL"
    status: registered
    sense: "the pattern-file lane over frontmatter; not a family; envelope rule_dsl"
  - term: "engine and configuration diagnostics"
    status: registered
    sense: "the codes outside every family; named, not a tenth family"
  - term: "jurisdiction"
    status: registered
    sense: "the walked file set declared by file_globs or --file-globs; never guessed"
