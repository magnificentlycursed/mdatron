# Where bold introduces a term (E0090). The convention holds in the methodology
# docs; elsewhere in the corpus bold is emphasis and `**Label:**` lead-ins.
coinage_globs:
  - "docs/methodology*.md"
label_schemes:
  allow:
    - "^MDATRON-[EWL][0-9]{4}$"
    # Bare code bodies (a registered term): the reserved-range table and the
    # cost ledger name codes without the namespace.
    - "^[EWL][0-9]{4}$"
    # Reference-shaped clusters that name things rather than coin schemes:
    # encodings, heading levels, advisories, version labels, DESIGN's own
    # DEF-n decision labels.
    - "^UTF-?(8|16|32)$"
    - "^H[1-6]$"
    - "^RUSTSEC-[0-9]{4}$"
    - "^V[0-9]$"
    - "^DEF[0-9]+$"
