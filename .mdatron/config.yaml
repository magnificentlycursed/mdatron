# mdatron configuration — seeded by `mdatron init`; adopter-owned (#77).
# file_globs declare what is in mdatron's jurisdiction; files outside them are
# not walked. mdatron's own governed corpus is the LIVING documentation — the
# shipped docs/ tree and the README (#187 part 2: the self-hosting gate
# retargeted from the frozen review archive to the corpus that actually
# changes) — plus the methodology docs that govern mdatron's own development
# (#96/#97). Tooling markdown deployed by the chassis (.claude/, .crosslink/)
# is not ours to validate.
file_globs:
  - "docs/**/*.md"
  - "README.md"
  - "DESIGN.md"
  # Redundant with docs/**/*.md (the walk dedups by path; a glob that matches
  # on disk is never a W0046 dead glob) — kept so the methodology jurisdiction
  # stays declared in its own right alongside its vocabulary_globs twin below.
  - "docs/methodology*.md"
# Vocabulary scope (#97, widened by #204): the naming register — the canonical
# lexicon of DESIGN § Project declarations (Terms) plus the methodology
# register (§5) — applies to every living governance document: DESIGN, the
# README, and the docs tree. Setting this list gates the WHOLE vocabulary
# family (E0090-E0094) to the matched files.
vocabulary_globs:
  - "DESIGN.md"
  - "README.md"
  - "docs/**/*.md"
